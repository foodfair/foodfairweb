	<style>
		/* Asegurando que el slider ocupe toda la pantalla en cualquier dispositivo */
		.sec-slider {
			position: relative;
			width: 100%;
			min-height: 100vh; /* Altura mínima del 100% del viewport */
			overflow: hidden;
		}

		.rev-slidebg {
			width: 100%;
			height: 100%;
			object-fit: cover; /* Cubre todo el contenedor sin distorsionar la imagen */
		}

		/* Asegurar que las imágenes dentro del slider cubran todo el área */
		.imagen__fondo {
			background-size: cover;
			background-position: center;
			width: 100%;
			height: 100vh; /* Ocupa el 100% del alto del viewport */
		}

		/* Ajuste de imágenes dentro de galerías */
		.wrap-pic-w, .gallery-item {
			width: 100%;
			max-width: 100%;
			height: auto;
		}

		/* Para asegurarse de que los contenedores de galería también sean responsivos */
		.gallery-item img {
